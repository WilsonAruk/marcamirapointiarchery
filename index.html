          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><path d="M6 14h12v7H6z"></path></svg>

      <div>
        <h1>Marcações de mira</h1>
        <p class="profile" id="profile"></p>
      </div>

      <div class="seg" role="group" aria-label="Tipo de arco" id="bow-group">
        <button type="button" data-bow="R">Recurvo</button>
        <button type="button" data-bow="C">Composto</button>
        <button type="button" data-bow="B">Barebow</button>
      </div>

      <div class="filters">
        <label class="field">
          <span>Categoria</span>
          <select id="cls">
            <optgroup label="Convencional">
              <option value="adulto">Adulto</option>
              <option value="sub21">Sub-21</option>
              <option value="sub18">Sub-18</option>
              <option value="master">Master 50+</option>
            </optgroup>
            <optgroup label="PCD · Para-tiro com arco">
              <option value="paraAberto">Para Aberto (Recurvo/Composto)</option>
              <option value="w1">Para W1</option>
              <option value="vi1">Para VI 1 (deficiência visual)</option>
              <option value="vi23">Para VI 2/3 (deficiência visual)</option>
            </optgroup>
          </select>
        </label>
        <div class="seg seg-small" role="group" aria-label="Sexo" id="sex-group">
          <button type="button" data-sex="M">Masc.</button>
          <button type="button" data-sex="F">Fem.</button>
        </div>
      </div>

      <div class="arrow-row">
        <span class="arrow-label">Flecha</span>
        <div class="seg seg-small" role="group" aria-label="Tipo de tubo da flecha" id="arrow-group">
          <button type="button" data-arrow="fina">Fina <small>outdoor</small></button>
          <button type="button" data-arrow="grossa">Grossa <small>indoor</small></button>
        </div>
      </div>

      <p class="notice" id="notice" hidden></p>
    </header>

    <section class="editor" aria-label="Incluir ou editar marcação">
      <div class="editor-head">
        <strong id="editor-title">Nova marcação</strong>
        <span class="badge" id="sel-badge"></span>
      </div>

      <div class="dist-pick" id="dist-pick" role="group" aria-label="Escolha a distância"></div>

      <div class="editor-main">
        <button type="button" class="round-btn" id="btn-minus" aria-label="Diminuir marcação">−</button>
        <div class="editor-value">
          <span id="sel-label"></span>
          <label class="sr-only" for="val-input">Valor da marcação</label>
          <input id="val-input" type="number" inputmode="decimal" step="0.05" placeholder="0.00">
          <button type="button" id="suggestion" hidden></button>
        </div>
        <button type="button" class="round-btn" id="btn-plus" aria-label="Aumentar marcação">+</button>
      </div>
      <div class="editor-step">
        <span>Passo</span>
        <div class="seg seg-dark" role="group" aria-label="Passo do ajuste" id="step-group">
          <button type="button" data-step="0.05">0,05</button>
          <button type="button" data-step="0.1">0,1</button>
          <button type="button" data-step="0.25">0,25</button>
        </div>
      </div>
      <div class="editor-actions">
        <button type="button" class="btn-ghost" id="btn-remove">Remover</button>
        <button type="button" class="btn-primary" id="btn-save">Salvar marcação</button>
      </div>
    </section>

    <section class="saved" aria-labelledby="saved-title">
      <div class="saved-head">
        <h2 id="saved-title">Minhas marcações</h2>
        <span id="saved-count"></span>
      </div>
      <div class="list" id="list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
